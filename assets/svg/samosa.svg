  <path d="M 50 17 Q 52 48 51 83" stroke="#8C3705" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Left Side Shading -->
  <path d="M 50 17 L 19 80 Q 50 85 50 83 Z" fill="#000000" opacity="0.12"/>
  <!-- Crust edge folds / pinched dough base -->
  <path d="M 17 76 Q 25 84 35 83 Q 45 84 55 83 Q 65 84 75 83 Q 83 80 84 76" 
        fill="none" stroke="#682402" stroke-width="3" stroke-linecap="round"/>
  <!-- Blistered fried texture spots -->
  <circle cx="38" cy="55" r="2.5" fill="#8C3705" opacity="0.45"/>
  <circle cx="62" cy="62" r="2.0" fill="#8C3705" opacity="0.45"/>
  <circle cx="45" cy="70" r="1.8" fill="#8C3705" opacity="0.45"/>
  <circle cx="58" cy="42" r="1.5" fill="#8C3705" opacity="0.4"/>
  <circle cx="34" cy="40" r="2.0" fill="#8C3705" opacity="0.4"/>
  <circle cx="68" cy="73" r="1.5" fill="#8C3705" opacity="0.45"/>
  <!-- Highlight / Sheen -->
  <path d="M 48 24 L 30 65" stroke="#FFE7BA" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Steam lines -->
  <path d="M 43 10 Q 40 5 43 1" fill="none" stroke="#FF9800" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <path d="M 50 11 Q 53 6 50 1" fill="none" stroke="#FF9800" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 57 10 Q 60 5 57 1" fill="none" stroke="#FF9800" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
</svg>

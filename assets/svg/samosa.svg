<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="samosaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="50%" stop-color="#E87A1E"/>
      <stop offset="100%" stop-color="#B85108"/>
    </linearGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC875"/>
      <stop offset="100%" stop-color="#8C3705"/>
    </linearGradient>
  </defs>
  <!-- Shadow Base -->
  <ellipse cx="50" cy="88" rx="35" ry="7" fill="#000000" opacity="0.15"/>
  <!-- Main Samosa Body -->
  <path d="M 50 14 Q 53 15 56 20 L 84 72 Q 86 78 81 81 Q 50 86 19 81 Q 14 78 16 72 L 44 20 Q 47 15 50 14 Z" 
        fill="url(#samosaGrad)" stroke="#8C3705" stroke-width="2"/>

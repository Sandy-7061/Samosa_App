<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="scooterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
  </defs>
  <!-- Motion Lines -->
  <line x1="4" y1="50" x2="14" y2="50" stroke="#FF5722" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="2" y1="58" x2="16" y2="58" stroke="#FF5722" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <line x1="6" y1="66" x2="12" y2="66" stroke="#FF5722" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Rear Delivery Box -->
  <rect x="18" y="34" width="22" height="22" rx="4" fill="url(#boxGrad)" stroke="#E65100" stroke-width="2"/>
  <!-- Hot food emblem on box -->
  <path d="M 29 42 Q 31 38 29 36" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 33 42 Q 35 38 33 36" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Seat & Body -->
  <path d="M 36 56 L 46 56 Q 52 56 56 62 L 66 62 Q 70 52 72 44" fill="none" stroke="#37474F" stroke-width="4" stroke-linecap="round"/>
  <path d="M 40 56 Q 48 50 60 54 L 62 68 L 38 68 Z" fill="url(#scooterGrad)"/>
  <!-- Handle & Windshield -->
  <line x1="72" y1="44" x2="70" y2="34" stroke="#37474F" stroke-width="4" stroke-linecap="round"/>
  <line x1="66" y1="35" x2="74" y2="35" stroke="#263238" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="76" cy="40" r="4" fill="#FFEB3B"/>
  <!-- Wheels -->
  <circle cx="28" cy="74" r="14" fill="#263238"/>
  <circle cx="28" cy="74" r="7" fill="#CFD8DC"/>
  <circle cx="74" cy="74" r="14" fill="#263238"/>
  <circle cx="74" cy="74" r="7" fill="#CFD8DC"/>
</svg>
